<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChilikovWeb — Marketing Hub</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0b1220;--bg2:#111827;--bg3:#1e293b;
    --blue:#2563eb;--blue-lt:#3b82f6;--blue-pale:#60a5fa;
    --white:#f8fafc;--slate:#e2e8f0;--muted:#94a3b8;--subtle:#475569;
    --green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#7c3aed;
    --border:rgba(37,99,235,0.2);--border2:rgba(37,99,235,0.12);
    --radius:8px;--radius-lg:12px;
  }
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--slate);min-height:100vh;}
  .nav{display:flex;align-items:center;padding:0 24px;height:56px;background:rgba(11,18,32,0.97);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:6px;overflow-x:auto;}
  .nav-logo{font-size:14px;font-weight:700;color:var(--blue-lt);margin-right:16px;white-space:nowrap;}
  .nav-logo span{color:var(--white);}
  .tab-btn{background:none;border:none;padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer;border-radius:6px;white-space:nowrap;transition:all .15s;}
  .tab-btn:hover{color:var(--slate);background:rgba(255,255,255,0.05);}
  .tab-btn.active{color:var(--white);background:var(--blue);font-weight:500;}
  .sync-bar{display:flex;align-items:center;gap:10px;padding:0 24px;margin-left:auto;flex-shrink:0;}
  .sync-status{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500;}
  .sync-ok{background:rgba(22,163,74,.2);color:#4ade80;}
  .sync-err{background:rgba(220,38,38,.15);color:#f87171;}
  .sync-loading{background:rgba(37,99,235,.2);color:var(--blue-pale);}
  .sync-btn{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--muted);cursor:pointer;}
  .sync-btn:hover{border-color:var(--blue);color:var(--blue-lt);}

  .page{display:none;padding:24px;max-width:1100px;margin:0 auto;}
  .page.active{display:block;}
  .card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:12px;}
  .card-title{font-size:14px;font-weight:600;color:var(--white);margin-bottom:12px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
  .stat{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px;}
  .stat-val{font-size:26px;font-weight:700;color:var(--white);}
  .stat-label{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em;}
  .stat.blue .stat-val{color:var(--blue-lt);}
  .stat.green .stat-val{color:#4ade80;}
  .stat.amber .stat-val{color:#fbbf24;}
  .stat.purple .stat-val{color:#a78bfa;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:13px;color:var(--white);outline:none;font-family:inherit;}
  input:focus,select:focus{border-color:var(--blue);}
  select option{background:var(--bg2);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius);border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-lt);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--slate);border-color:var(--blue);}
  .btn-danger{background:transparent;color:var(--red);border:none;padding:4px 8px;font-size:12px;cursor:pointer;}
  .btn-danger:hover{background:rgba(220,38,38,.1);}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--bg2);}
  td{padding:9px 10px;border-bottom:1px solid var(--border2);vertical-align:middle;}
  tr:hover td{background:rgba(37,99,235,.04);}
  tr:last-child td{border-bottom:none;}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .f-btn{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:4px 12px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s;}
  .f-btn:hover{border-color:var(--blue);color:var(--slate);}
  .f-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .msg-box{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.7;color:var(--slate);white-space:pre-wrap;margin:8px 0;}
  .copy-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:11px;color:var(--muted);cursor:pointer;}
  .copy-btn:hover{border-color:var(--blue);color:var(--blue-lt);}
  .copy-btn.copied{background:rgba(22,163,74,.15);border-color:#16a34a;color:#4ade80;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;}
  .badge-blue{background:rgba(37,99,235,.2);color:var(--blue-pale);}
  .badge-amber{background:rgba(217,119,6,.2);color:#fbbf24;}
  .badge-green{background:rgba(22,163,74,.2);color:#4ade80;}
  .rule{border-left:3px solid var(--blue);background:rgba(37,99,235,.08);border-radius:0 6px 6px 0;padding:8px 14px;font-size:12px;color:var(--blue-pale);margin:10px 0;}
  .tactic{background:var(--bg3);border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.5;color:var(--muted);}
  .tactic strong{color:var(--white);}
  .tracker-input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;color:var(--white);width:60px;text-align:center;}
  .fu-warn{color:#f87171;font-size:11px;}
